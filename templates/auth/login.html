{% extends "base.html" %}

{% block title %}Sign in · OpenSkagit{% endblock %}

{% block content %}
<style>
  .os-login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#042c53 0%,#0a5260 58%,#e8f4f2 58%,#f7f9fb 100%);font-family:Inter,system-ui,sans-serif}
  .os-login-card{width:min(100%,420px);padding:34px;background:#fff;border:1px solid #dfe7ee;border-radius:18px;box-shadow:0 24px 60px rgba(4,44,83,.22)}
  .os-login-brand{display:flex;align-items:center;gap:10px;color:#042c53;text-decoration:none;font:700 24px "DM Sans",Inter,sans-serif}
  .os-login-brand img{width:38px;height:38px;object-fit:contain}
  .os-login-card h1{margin:28px 0 6px;color:#042c53;font:700 28px "DM Sans",Inter,sans-serif}
  .os-login-card p{margin:0 0 22px;color:#617082;font-size:14px}
  .os-login-card form p{margin:0 0 14px;color:#3d4d5c;font-size:13px}
  .os-login-card label{display:block;margin-bottom:5px;font-weight:600}
  .os-login-card input{width:100%;padding:10px 11px;border:1px solid #d4e0e6;border-radius:8px}
  .os-login-card button{width:100%;margin-top:8px;padding:11px;border:0;border-radius:8px;background:#00828a;color:#fff;font-weight:700;cursor:pointer}
  .os-login-card button:hover{background:#006b73}
  .os-login-footer{margin-top:18px;text-align:center;color:#7a8995;font-size:12px}
</style>
<main class="os-login">
  <section class="os-login-card" aria-labelledby="login-title">
    <a class="os-login-brand" href="/" aria-label="OpenSkagit home"><img src="https://res.cloudinary.com/dfz4bhlzs/image/upload/v1768253765/logoicon_c_crop_w_480_h_467_x_0_y_0-Picsart-BackgroundRemover_uklqfi.png" alt=""><span>OpenSkagit</span></a>
    <h1 id="login-title">Welcome back</h1>
    <p>Sign in to continue to your OpenSkagit workspace.</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Sign in</button>
    </form>
    <div class="os-login-footer">Skagit Valley · OpenSkagit</div>
  </section>
</main>
{% endblock %}
